stages:
  - build
  - docker-create

commit-verify:
  image: ubuntu:22.04
  stage: build
  script:
    - apt-get update
    - apt-get install -yq git wget gnupg
    # Copy commit script to build directory and execute
    - wget https://gitlab.com/YottaDB/DB/YDB/-/raw/master/ci/commit_verify.sh
    - chmod +x commit_verify.sh
    - ./commit_verify.sh com/needs_copyright.sh https://gitlab.com/YottaDB/DB/YDBTest/

# Test that imptp.rs builds with the latest commit of YDBRust
build-imptp-rs:
  image:
      name: yottadb/yottadb-debian:latest-master
      entrypoint: [""]
  stage: build
  script:
    - apt-get update
    - apt-get install -yq --no-install-recommends build-essential bindgen
    - cd com/imptp-rs; . $HOME/.cargo/env; cargo check

# Run changed tests on every push
run-tests:
  image:
       name: registry.gitlab.com/yottadb/db/ydbtest
       entrypoint: [""]
  stage: build
  interruptible: true
  artifacts:
    paths:
      - testarea1/
      - testarea2/
      - testarea3/
      - pipeline-test-ydbtest-build.out
    expire_in: 1 month
    when: always
  script:
    - docker/pipeline-test-ydbtest.csh

# Build test system on docker
docker-ydbtest-image:
  image: docker:latest
  stage: docker-create
  # Workaround for bug in docker 29.7:
  # https://gitlab.com/gitlab-org/container-registry/-/work_items/2367
  # https://github.com/moby/buildkit/issues/7007
  variables:
    BUILDX_NO_DEFAULT_ATTESTATIONS: "1"
  services:
    # "docker push" runs up to 5 blob uploads at once (the dockerd default) and registry.gitlab.com
    # has been seen closing one of them mid upload. Push 2 at a time instead: fewer connections are
    # open at any instant, so a push is less likely to run into one that the registry has closed.
    - name: docker:dind
      command: ["--max-concurrent-uploads=2"]
  # A job level retry re-runs the ~20 minute "docker image build" below, so it is an expensive way
  # to get past a "docker push" that died on a network error. Retry the push itself instead; it
  # skips the blobs the registry already has, so a retry after a partial push takes seconds. The
  # job level retry stays as a backstop for a network error in the build itself.
  retry: 1
  script:
    - docker image build -f docker/Dockerfile --progress=plain -t registry.gitlab.com/yottadb/db/ydbtest .
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    # Note: the docker:latest image runs busybox sh, hence the POSIX shell syntax below.
    - |
      n=0
      until docker push registry.gitlab.com/yottadb/db/ydbtest; do
        n=$((n+1))
        if [ $n -ge 5 ]; then
          echo "docker push failed after $n attempts"
          exit 1
        fi
        echo "docker push attempt $n failed; retrying in 30 seconds"
        sleep 30
      done
  only:
    - master@YottaDB/DB/YDBTest
